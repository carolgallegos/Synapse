services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      USE_MOCK_SPLUNK: "true"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    volumes:
      - ./backend/data:/app/data:ro

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
