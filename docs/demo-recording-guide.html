<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Synapse — Guía de grabación</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      background: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      font-family: system-ui, sans-serif;
    }
    h1 { color: #f3f4f6; font-size: 1rem; margin-bottom: 0.75rem; }
    .frame {
      max-width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
    }
    img, object { display: block; width: 100%; max-width: 1920px; height: auto; }
    p { color: #9ca3af; font-size: 0.85rem; margin-top: 1rem; max-width: 1920px; text-align: center; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <h1>Synapse — Guía visual para grabar el demo (~2 min)</h1>
  <div class="frame">
    <object data="demo-recording-guide.svg" type="image/svg+xml" width="1920" height="1080">
      <img src="demo-recording-guide.svg" alt="Guía de grabación Synapse" width="1920" height="1080" />
    </object>
  </div>
  <p>
    Abre este archivo en el navegador. Para guardar como PNG: clic derecho en la imagen → Guardar,
    o imprime como PDF. También puedes abrir <a href="demo-recording-guide.svg">demo-recording-guide.svg</a> directamente.
  </p>
</body>
</html>
